[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ilpc-ableton"
version = "0.1.0"
description = "Automate music production in Ableton Live: song specs -> clips, MIDI export, live automation, MCP server for Claude."
requires-python = ">=3.10"
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
dev = ["pytest>=8", "mido>=1.3", "python-osc>=1.8"]

[project.scripts]
ilpc-ableton = "ilpc_ableton.cli:main"
ilpc-ableton-mcp = "ilpc_ableton.mcp_server:main"

[tool.setuptools]
packages = ["ilpc_ableton"]

[tool.pytest.ini_options]
testpaths = ["tests"]
